<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xếp loại học lực</title>
</head>
<body>
<script>
    let diem = +prompt("Nhập Điểm: ");
     if (diem >= 8.0) {
         console.log("Gioi")
     } else if (diem >=6.5 && diem < 8.0) {
         console.log("Khá")
     } else if (diem >= 5.0 && diem <= 6.5) {
         console.log("Trung Bình")
     } else if (diem < 5.0) {
         console.log("Yếu")
     } else {
         console.log("điểm ko hợp lệ")
     }
</script>
</body>
</html>
